services:
  ai-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - D:/ai_models:/ai_models
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MODEL_DIR=/ai_models
      - MONGO_URL=mongodb://admin:secret@mongo:27017
      - MONGO_DB=ai_chat
      - MONGO_COLLECTION=history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret
      - ME_CONFIG_MONGODB_URL=mongodb://admin:secret@mongo:27017

volumes:
  mongo-data:
    driver: local
